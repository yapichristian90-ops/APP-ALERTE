<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .canvas{width:432px;height:432px;position:relative;}
</style>
</head>
<body>
<div class="canvas" id="c">
<svg width="432" height="432" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="52%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#B4460F"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3E8"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- background fills the whole safe zone so it looks correct as an adaptive-icon foreground too -->
  <rect x="0" y="0" width="432" height="432" rx="96" fill="url(#bg)"/>
  <rect x="0" y="0" width="432" height="432" rx="96" fill="url(#glow)"/>

  <!-- shield: protection -->
  <g transform="translate(216,214)" filter="url(#soft)">
    <path d="M0 -112 L90 -78 C90 -4 72 66 0 122 C-72 66 -90 -4 -90 -78 Z"
          fill="url(#shieldGrad)"/>
    <path d="M0 -112 L90 -78 C90 -4 72 66 0 122 C-72 66 -90 -4 -90 -78 Z"
          fill="none" stroke="#C2410C" stroke-width="3" stroke-opacity="0.12"/>

    <!-- location pin: tracking / being found. Reads as one clean silhouette at any size. -->
    <g transform="translate(0,-6)">
      <path d="M0 -46 C27 -46 47 -25 47 2 C47 34 14 66 0 80 C-14 66 -47 34 -47 2 C-47 -25 -27 -46 0 -46 Z"
            fill="url(#pinGrad)"/>
      <circle cx="0" cy="0" r="18" fill="url(#shieldGrad)"/>
    </g>
  </g>
</svg>
</div>
</body></html>
