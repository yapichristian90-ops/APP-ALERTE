<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Plus+Jakarta+Sans:wght@700&display=swap');
  html,body{margin:0;padding:0;background:transparent;}
</style>
</head>
<body>
<div id="c" style="width:900px;height:300px;position:relative;display:flex;align-items:center;gap:26px;padding:0 20px;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;">
  <svg width="160" height="160" viewBox="0 0 432 432" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#FB923C"/>
        <stop offset="55%" stop-color="#F97316"/>
        <stop offset="100%" stop-color="#C2410C"/>
      </linearGradient>
      <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#FFF7ED"/>
      </linearGradient>
      <radialGradient id="glow" cx="50%" cy="30%" r="70%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="0" y="0" width="432" height="432" rx="96" fill="url(#bg)"/>
    <rect x="0" y="0" width="432" height="432" rx="96" fill="url(#glow)"/>
    <g transform="translate(216,222)">
      <path d="M0 -108 L86 -76 C86 -6 70 62 0 116 C-70 62 -86 -6 -86 -76 Z"
            fill="url(#shieldGrad)" stroke="#7C2D12" stroke-width="6" stroke-opacity="0.15"/>
      <rect x="-11" y="-56" width="22" height="86" rx="11" fill="#EA580C"/>
      <circle cx="0" cy="52" r="13" fill="#EA580C"/>
    </g>
  </svg>
  <div>
    <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:96px;letter-spacing:-3px;line-height:1;color:#1C1917;">
      ALERTE<span style="color:#F97316;">.</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
      <div style="display:flex;gap:4px;">
        <div style="width:22px;height:14px;background:#F77F00;border-radius:2px;"></div>
        <div style="width:22px;height:14px;background:#FFFFFF;border:1px solid #E7E5E4;border-radius:2px;"></div>
        <div style="width:22px;height:14px;background:#009E60;border-radius:2px;"></div>
      </div>
      <div style="font-weight:700;font-size:20px;letter-spacing:3px;color:#78716C;text-transform:uppercase;">Côte d'Ivoire</div>
    </div>
  </div>
</div>
</body></html>
